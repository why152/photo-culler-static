name: Test static application
on:
  pull_request:
  push:
    branches: ["codex/**"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: chrome
    runs-on: ${{ matrix.os }}
    env:
      PW_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Prepare Chrome
        timeout-minutes: 5
        run: |
          if command -v google-chrome >/dev/null 2>&1 && google-chrome --version; then
            echo "Using runner Chrome for the full browser suites"
          else
            npx playwright install --with-deps chrome
          fi
      - run: npm run check
      - run: npm test
      - run: npm run test:dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
