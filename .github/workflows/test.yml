name: Test static application
on:
  pull_request:
  push:
    branches: ["codex/**"]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: chrome
          - os: windows-latest
            channel: msedge
    runs-on: ${{ matrix.os }}
    env:
      PW_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.channel }}
      - run: npm run check
      - run: npm test
      - run: npm run test:dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
